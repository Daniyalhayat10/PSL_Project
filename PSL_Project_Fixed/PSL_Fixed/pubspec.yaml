name: psl_urdu_detector
description: Pakistan Sign Language Urdu Detector
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & permissions
  camera: ^0.10.5+9
  permission_handler: ^11.3.1

  # TFLite — runs BOTH hand landmark model AND classification model
  tflite_flutter: ^0.11.0

  # Image processing for camera frames → model input
  image: ^4.1.7

  # UI & utilities
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  flutter_tts: ^4.0.2
  path_provider: ^2.1.3
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/models/
  fonts:
    - family: JameelNooriNastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq.ttf

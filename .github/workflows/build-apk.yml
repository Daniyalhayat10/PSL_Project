name: Build PSL APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        working-directory: PSL_Project_Fixed/PSL_Fixed
        run: flutter pub get

      - name: Build APK
        working-directory: PSL_Project_Fixed/PSL_Fixed
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSL-Release-APK
          path: PSL_Project_Fixed/PSL_Fixed/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
